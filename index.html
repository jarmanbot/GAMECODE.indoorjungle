<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111416" />
    <title>Indoor Jungle — Prototype</title>
  </head>
  <body>
    <main id="app-shell" aria-label="Indoor Jungle prototype">
      <header class="hud hud-top">
        <div class="hud-block hud-balance" aria-label="Coin balance">
          <span class="coin-mark" aria-hidden="true"></span>
          <span id="coin-count">0</span>
        </div>
        <div class="hud-objective">
          <span class="eyebrow">CURRENT OBJECTIVE</span>
          <strong id="objective-text">Find a loose empty pot</strong>
        </div>
        <button class="icon-button" id="settings-button" type="button" aria-label="Open settings">⚙</button>
      </header>

      <section id="game-stage" aria-label="Indoor Jungle neighbourhood">
        <div id="overview-overlay" class="overview-overlay" hidden>
          <div class="overview-heading">
            <span class="overview-kicker">INSPECTION MODE</span>
            <strong>FULL CITY OVERVIEW</strong>
            <small>No walking or remote collection while overview is active.</small>
          </div>
          <div class="overview-zones" aria-label="Future zones">
            <span class="overview-zones-title">PROVISIONAL FUTURE ZONES</span>
            <button class="overview-zone" type="button" data-overview-zone="willow-reserve"><span aria-hidden="true">▣</span><strong>WILLOW RESERVE</strong><em>LOCKED</em></button>
            <button class="overview-zone" type="button" data-overview-zone="east-gardens"><span aria-hidden="true">▣</span><strong>EAST GARDENS</strong><em>LOCKED</em></button>
            <button class="overview-zone" type="button" data-overview-zone="north-works"><span aria-hidden="true">▣</span><strong>NORTH WORKS</strong><em>LOCKED</em></button>
            <button class="overview-zone" type="button" data-overview-zone="south-plots"><span aria-hidden="true">▣</span><strong>SOUTH PLOTS</strong><em>LOCKED</em></button>
          </div>
          <div id="overview-selection" class="overview-selection" hidden>
            <span class="overview-kicker">LOCKED ZONE</span>
            <strong id="overview-selection-name">NOT ACCESSIBLE YET</strong>
            <small id="overview-selection-condition">Unlock condition provisional.</small>
          </div>
          <button id="overview-return" class="overview-return" type="button">↩ RETURN TO ALEX</button>
        </div>
      </section>

      <button id="interact-button" class="interact-button" type="button" hidden>
        <span class="interact-dot" aria-hidden="true"></span>
        <span id="interact-label">INTERACT</span>
      </button>

      <nav class="hud hud-bottom" aria-label="Game navigation">
        <button class="nav-button" data-panel="bag" type="button"><span class="nav-icon">▣</span><span>BAG</span></button>
        <button class="nav-button" data-panel="map" type="button"><span class="nav-icon">⌖</span><span>MAP</span></button>
        <button class="nav-button" data-panel="tasks" type="button"><span class="nav-icon">☷</span><span>TASKS</span></button>
        <button class="nav-button" data-panel="home" type="button"><span class="nav-icon">⌂</span><span>HOME</span></button>
        <button class="nav-button" data-panel="more" type="button"><span class="nav-icon">•••</span><span>MORE</span></button>
        <div class="zoom-controls" aria-label="Camera zoom controls">
          <button id="zoom-out" type="button" aria-label="Zoom out (comma key)"><span class="zoom-glyph">−</span><span class="zoom-caption">OUT</span></button>
          <span id="zoom-label">NORMAL</span>
          <button id="zoom-in" type="button" aria-label="Zoom in (period key)"><span class="zoom-glyph">＋</span><span class="zoom-caption">IN</span></button>
        </div>
      </nav>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div id="panel-backdrop" class="panel-backdrop" hidden>
        <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">INDOOR JUNGLE</span>
              <h2 id="panel-title">Bag</h2>
            </div>
            <button id="close-panel" class="close-button" type="button" aria-label="Close panel">×</button>
          </div>
          <div id="panel-body" class="panel-body"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
