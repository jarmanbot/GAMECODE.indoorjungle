<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111416" />
    <title>Indoor Jungle — Prototype</title>
  </head>
  <body>
    <main id="app-shell" aria-label="Indoor Jungle prototype">
      <header class="hud hud-top">
        <div class="hud-block hud-balance" aria-label="Coin balance">
          <span class="coin-mark" aria-hidden="true"></span>
          <span id="coin-count">0</span>
        </div>
        <div class="hud-objective">
          <span class="eyebrow">CURRENT OBJECTIVE</span>
          <strong id="objective-text">Find a loose empty pot</strong>
        </div>
        <button class="icon-button" id="settings-button" type="button" aria-label="Open settings">⚙</button>
      </header>

      <section id="game-stage" aria-label="Indoor Jungle street"></section>

      <section id="phone-control-panel" class="phone-control-panel" aria-label="Phone movement and camera controls">
        <div id="joystick" class="joystick" role="application" aria-label="Move Alex with the joystick">
          <span class="joystick-ring" aria-hidden="true"></span>
          <span id="joystick-knob" class="joystick-knob" aria-hidden="true"></span>
        </div>
        <div class="control-console" aria-label="Arcade controls">
      <div class="console-label" aria-hidden="true"><span>INTENDONT</span><span>GAMEJOY</span></div>
          <div class="arcade-controls" aria-label="Arcade actions">
            <button id="arcade-a" class="arcade-button" type="button" aria-label="Hop"><strong>A</strong></button>
            <button id="arcade-b" class="arcade-button" type="button" aria-label="Use equipped tool"><strong>B</strong></button>
          </div>
        </div>
      </section>

      <div id="rotate-overlay" class="rotate-overlay" hidden role="alert" aria-live="assertive">
        <div class="rotate-card">
          <span class="eyebrow">PHONE ORIENTATION</span>
          <strong>Rotate your phone to play</strong>
          <small>Portrait gameplay is supported in this prototype.</small>
        </div>
      </div>

      <button id="interact-button" class="interact-button" type="button" hidden>
        <span class="interact-dot" aria-hidden="true"></span>
        <span id="interact-label">INTERACT</span>
      </button>

      <nav class="hud hud-bottom" aria-label="Game navigation">
        <button class="nav-button" data-panel="bag" type="button"><span class="nav-icon">▣</span><span>BAG</span></button>
        <button class="nav-button" data-panel="map" type="button"><span class="nav-icon">⌖</span><span>MAP</span></button>
        <button class="nav-button" data-panel="tasks" type="button"><span class="nav-icon">☷</span><span>TASKS</span></button>
        <button class="nav-button" data-panel="home" type="button"><span class="nav-icon">⌂</span><span>HOME</span></button>
        <button class="nav-button" data-panel="more" type="button"><span class="nav-icon">•••</span><span>MORE</span></button>
        <div class="zoom-controls" aria-label="Camera zoom controls">
          <button id="tool-selector" class="tool-selector" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Open tool selector"><span id="tool-selector-icon" aria-hidden="true">—</span></button>
          <button id="zoom-toggle" type="button" aria-label="Zoom in (period key)"><span id="zoom-glyph" class="zoom-glyph">＋</span><span id="zoom-caption" class="zoom-caption">IN</span></button>
        </div>
      </nav>

      <div id="tool-popup-backdrop" class="tool-popup-backdrop" hidden>
        <section id="tool-popup" class="tool-popup" role="dialog" aria-modal="true" aria-labelledby="tool-popup-title">
          <div class="tool-popup-heading"><strong id="tool-popup-title">TOOLS</strong><button id="tool-popup-close" class="tool-popup-close" type="button" aria-label="Close tool selector">×</button></div>
          <div id="tool-slots" class="tool-slots"></div>
        </section>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div id="panel-backdrop" class="panel-backdrop" hidden>
        <section id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">INDOOR JUNGLE</span>
              <h2 id="panel-title">Bag</h2>
            </div>
            <div class="panel-heading-actions">
              <button id="map-centre" class="map-centre-button" type="button" hidden>⌖ CENTRE ON ALEX</button>
              <button id="close-panel" class="close-button" type="button" aria-label="Close panel">×</button>
            </div>
          </div>
          <div id="panel-body" class="panel-body"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
